# Запуск на своём сервере: база PostGIS, приложение и Caddy с HTTPS.
# Обычно запускается через deploy/install.sh, переменные лежат в deploy/.env.
name: masl

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: masl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_DB: masl
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U masl -d masl']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
    image: masl-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://masl:${POSTGRES_PASSWORD}@db:5432/masl
      BOT_TOKEN: ${BOT_TOKEN:?задайте BOT_TOKEN в deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в deploy/.env}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
